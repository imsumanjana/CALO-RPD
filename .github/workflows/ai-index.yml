name: AI repository intelligence

on:
  push:
    paths:
      - "calo_bootstrap/**"
      - "calo_rpd_studio/**"
      - "tests/**"
      - "scripts/ai-index*"
      - "scripts/ai-agent-guard.py"
      - "AGENT.md"
      - "AGENTS.md"
      - "**/AGENT.md"
      - "**/AGENTS.md"
      - "pyproject.toml"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/**"
      - ".ai/**"
  pull_request:
    paths:
      - "calo_bootstrap/**"
      - "calo_rpd_studio/**"
      - "tests/**"
      - "scripts/ai-index*"
      - "scripts/ai-agent-guard.py"
      - "AGENT.md"
      - "AGENTS.md"
      - "**/AGENT.md"
      - "**/AGENTS.md"
      - "pyproject.toml"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/**"
      - ".ai/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-index-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify protected agent policy
        run: python scripts/ai-agent-guard.py --check
      - name: Verify committed intelligence freshness
        run: python scripts/ai-index guard --no-semantic
      - name: Verify deterministic regeneration is byte-stable
        run: |
          python scripts/ai-index init
          git diff --exit-code -- .ai
      - name: Verify optional concept retrieval benchmark
        env:
          AI_INDEX_EMBEDDING_PROVIDER: concept
        run: |
          python scripts/ai-index embeddings update
          python scripts/ai-index embeddings benchmark --check
