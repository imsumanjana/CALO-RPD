name: AI repository intelligence v2 migration bootstrap

on:
  push:
    branches:
      - agent/ai-repository-intelligence
    paths:
      - ".ai-migration/**"
      - ".github/workflows/ai-index-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-index-v2-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/agent/ai-repository-intelligence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact migration revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Reconstruct and verify migration candidate
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .ai-migration/calo-ai-v2-part-00 \
            .ai-migration/calo-ai-v2-part-01 \
            .ai-migration/calo-ai-v2-part-02a \
            .ai-migration/calo-ai-v2-part-02b \
            .ai-migration/calo-ai-v2-part-02c \
            .ai-migration/calo-ai-v2-part-03 \
            > /tmp/calo-ai-v2-migration.b64
          printf '%s  %s\n' 'd2dbe063035935b11152b408ed704a397399ced643ea8213a5934f60ce63f681' /tmp/calo-ai-v2-migration.b64 | sha256sum -c -
          base64 --decode /tmp/calo-ai-v2-migration.b64 > /tmp/calo-ai-v2-migration.tar.gz
          printf '%s  %s\n' '3e20be96f8b7e1baedba4101303724f2f6b6ab86eecea6d0de64302be1194deb' /tmp/calo-ai-v2-migration.tar.gz | sha256sum -c -
          tar -xzf /tmp/calo-ai-v2-migration.tar.gz
          chmod +x scripts/ai-index scripts/ai-agent-guard.py || true
          rm -rf .ai-migration
          rm -f .github/workflows/ai-index-bootstrap.yml
          grep -qxF '.ai-cache/' .gitignore || printf '\n.ai-cache/\n' >> .gitignore
          grep -qxF '.ai-tmp/' .gitignore || printf '.ai-tmp/\n' >> .gitignore
      - name: Repair protected repository-intelligence policy
        run: python scripts/ai-agent-guard.py --repair --root . --canonical AGENTS.md
      - name: Generate exhaustive sharded intelligence
        run: |
          python scripts/ai-index init
          python scripts/ai-index check
      - name: Verify deterministic repository routing benchmark
        env:
          AI_INDEX_EMBEDDING_PROVIDER: concept
        run: |
          python scripts/ai-index embeddings update
          python scripts/ai-index embeddings benchmark --check
      - name: Verify protected policy after regeneration
        run: python scripts/ai-agent-guard.py --check --root .
      - name: Commit migrated snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Migration produced no repository changes.'
            exit 0
          fi
          git commit -m 'Migrate repository intelligence to sharded v2'
          git push origin HEAD:agent/ai-repository-intelligence
