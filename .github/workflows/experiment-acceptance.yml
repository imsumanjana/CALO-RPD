name: Experiment lifecycle and GUI acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiment-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  QT_QPA_PLATFORM: offscreen
  CUDA_VISIBLE_DEVICES: "-1"
  CALO_ACCEPTANCE_LANE: compatibility

jobs:
  contracts:
    name: Experiment acceptance (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install Linux Qt runtime libraries
        id: qt_runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Select Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - name: Install primary hash-locked Linux environment
        if: runner.os == 'Linux' && matrix.python == '3.11'
        shell: bash
        run: python -m pip install --require-hashes -r requirements-lock-ci-py311-linux.txt
      - name: Resolve CPU compatibility environment
        if: runner.os != 'Linux' || matrix.python != '3.11'
        shell: bash
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Record dependency identity
        shell: bash
        run: |
          mkdir -p artifacts/experiment-acceptance
          python -m pip freeze --all > artifacts/experiment-acceptance/environment.txt
      - name: Exercise real lifecycle and window-wide wiring
        shell: bash
        run: >-
          python scripts/qa/isolated_test_entry.py
          -p pytestqt.plugin -p omission_plugin -q -ra --omit-protected-cases
          --evidence-output artifacts/experiment-acceptance/inventory.json
          --junitxml artifacts/experiment-acceptance/tests.xml
          tests/integration/test_real_experiment_lifecycle.py
          tests/integration/test_workspace_execution_control.py
          tests/gui/test_gui_wiring_acceptance.py
          tests/unit/test_execution_snapshot_contract.py
          tests/unit/test_test_inventory_contract.py
          tests/unit/test_current_policy_safety_contract.py
          tests/unit/test_tsh_calo_automatic_qualification.py
          tests/unit/test_v640_stage_b.py
      - name: Exercise actual Linux symlink and manifest contracts
        if: runner.os == 'Linux'
        run: python scripts/qa/validate_platform_filesystem.py --output artifacts/experiment-acceptance/linux-filesystem.json
      - name: Inventory static GUI connections
        run: python scripts/qa/gui_wiring_audit.py --output artifacts/experiment-acceptance/gui-wiring.json
      - name: Retain outcomes including every omission
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: experiment-acceptance-${{ runner.os }}-py${{ matrix.python }}
          path: artifacts/experiment-acceptance
          if-no-files-found: error
          retention-days: 30

# CPU compatibility jobs do not establish CUDA, protected-case, container or release qualification.
# The explicit physical-device and container gates remain in ci.yml and the acceptance ledger.
