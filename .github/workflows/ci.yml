name: CALO-RPD release validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_physical_cuda:
        description: Run the qualification lane on a trusted CALO CUDA runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: calo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONPATH: .
  QT_QPA_PLATFORM: offscreen

jobs:
  source:
    name: Source, scientific tests, and locks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use the release Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock-ci-py311-linux.txt
      - name: Install the hash-locked validation environment
        run: python -m pip install --require-hashes --requirement requirements-lock-ci-py311-linux.txt
      - name: Verify exact, hash-complete dependency locks
        run: |
          python -m calo_rpd_studio.scripts.verify_requirements_lock requirements-lock-cpu-py311-linux.txt --expect-index https://download.pytorch.org/whl/cpu --expect-pin torch==2.10.0+cpu --expect-pin cma==4.4.4
          python -m calo_rpd_studio.scripts.verify_requirements_lock requirements-lock-cuda128-py311-linux.txt --expect-index https://download.pytorch.org/whl/cu128 --expect-pin torch==2.10.0+cu128 --expect-pin cma==4.4.4
          python -m calo_rpd_studio.scripts.verify_requirements_lock requirements-lock-ci-py311-linux.txt --match-lock requirements-lock-cpu-py311-linux.txt --expect-index https://download.pytorch.org/whl/cpu --expect-pin torch==2.10.0+cpu --expect-pin ruff==0.15.22 --expect-pin mypy==1.20.2 --expect-pin uv==0.11.29
      - name: Verify source and generated schema
        run: |
          python -m compileall -q calo_rpd_studio calo_bootstrap tests
          python -m calo_rpd_studio.scripts.generate_experiment_schema --check
          ruff check .
          ruff format --check calo_bootstrap calo_rpd_studio tests
      - name: Verify the typed safety boundary
        run: >-
          mypy
          --follow-imports=skip
          --check-untyped-defs
          calo_rpd_studio/compute/memory_budget.py
          calo_rpd_studio/compute/device_lease.py
          calo_rpd_studio/experiments/study_strength.py
          calo_rpd_studio/algorithms/lshade.py
          calo_rpd_studio/algorithms/cma_es.py
          calo_rpd_studio/scripts/generate_artifact_manifest.py
          calo_rpd_studio/scripts/verify_requirements_lock.py
          calo_rpd_studio/scripts/verify_distribution_stage.py
          calo_rpd_studio/scripts/container_smoke.py
          calo_rpd_studio/orpd/mathematical_reference.py
          calo_rpd_studio/scripts/run_mathematical_reference.py
          calo_rpd_studio/scripts/validate_packaged_gui.py
          calo_rpd_studio/accelerated/cuda_timing.py
          calo_rpd_studio/scripts/validate_cuda_hot_path.py
          calo_rpd_studio/scripts/validate_cuda_policy_hot_path.py
      - name: Run unit, integration, regression, and scientific tests
        run: |
          # The v6.9 file is an immutable historical-freeze gate. The active release freeze is
          # regenerated only at G11, after the user-approved architecture scope is complete.
          coverage run --source=calo_rpd_studio -m pytest -q --ignore=tests/unit/test_v690_release_integrity.py
          coverage report --skip-covered --ignore-errors --fail-under=60

  compatibility:
    name: Compatibility (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use compatibility Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU compatibility environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pip freeze --all > compatibility-environment.txt
      - name: Verify historical loading and current round-trips
        run: >-
          python -m pytest -q
          tests/unit/test_config.py
          tests/integration/test_database_workflow.py
          tests/unit/test_calo_v41_policy_system.py
          tests/unit/test_v680_policy_independence.py
      - name: Upload the resolved compatibility environment
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: compatibility-${{ runner.os }}-py${{ matrix.python }}-environment
          path: compatibility-environment.txt
          if-no-files-found: error
          retention-days: 14

  headless-gui:
    name: Headless scientist GUI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use the release Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock-ci-py311-linux.txt
      - name: Install the hash-locked validation environment
        run: python -m pip install --require-hashes --requirement requirements-lock-ci-py311-linux.txt
      - name: Exercise navigation, scientist workflow, accessibility, and rendering
        env:
          CALO_GUI_ARTIFACT_DIR: artifacts/gui
        run: python -m pytest -q tests/gui tests/unit/test_scientist_gui_contract.py
      - name: Upload the visual smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: headless-gui-evidence
          path: artifacts/gui
          if-no-files-found: error
          retention-days: 14

  artifact:
    name: Wheel and source artifact manifest
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use the release Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install build tooling from the validation lock
        run: python -m pip install --require-hashes --requirement requirements-lock-ci-py311-linux.txt
      - name: Build and inventory only staged output
        run: |
          python -c "from pathlib import Path; stage=Path('artifacts/python-dist'); assert not stage.exists(); stage.mkdir(parents=True)"
          python -m build --no-isolation --outdir artifacts/python-dist
          python -m calo_rpd_studio.scripts.verify_distribution_stage --stage artifacts/python-dist
          python -m pip install --no-deps artifacts/python-dist/*.whl
          (cd /tmp && PYTHONPATH= python -c "import calo_rpd_studio; import calo_bootstrap")
          (cd /tmp && PYTHONPATH= QT_QPA_PLATFORM=offscreen python -m calo_rpd_studio.scripts.validate_packaged_gui --output "$GITHUB_WORKSPACE/artifacts/python-dist/packaged-gui" --forbid-import-root "$GITHUB_WORKSPACE")
          python -m calo_rpd_studio.scripts.generate_artifact_manifest --stage artifacts/python-dist --output artifacts/python-dist/artifact-manifest.json
      - name: Upload distributions and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-distributions
          path: artifacts/python-dist
          if-no-files-found: error
          retention-days: 30

  cpu-image:
    name: CPU image, SBOM, security, and runtime smoke
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CALO_CPU_IMAGE: calo-rpd-studio:ci-cpu-${{ github.sha }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build the CPU image with attestations
        id: build_cpu
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.CALO_CPU_IMAGE }}
          build-args: |
            RUNTIME_LOCK=requirements-lock-cpu-py311-linux.txt
            SOURCE_COMMIT=${{ github.sha }}
            SOURCE_TRACKED_CLEAN=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=calo-cpu
          cache-to: type=gha,mode=max,scope=calo-cpu
      - name: Verify non-root and read-only runtime contracts
        run: |
          test "$(docker image inspect "$CALO_CPU_IMAGE" --format '{{.Config.User}}')" = "10001:10001"
          mkdir -p artifacts/container/runtime
          sudo chown 10001:10001 artifacts/container/runtime
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --memory 24g --tmpfs /tmp:rw,nosuid,nodev,size=536870912,uid=10001,gid=10001,mode=1777 --mount type=bind,source="$PWD/artifacts/container/runtime",target=/data --entrypoint python "$CALO_CPU_IMAGE" -m calo_rpd_studio.scripts.container_smoke --require-durable-source
          sudo chown -R "$(id -u):$(id -g)" artifacts/container/runtime
          mv artifacts/container/runtime/image-filesystem-manifest.json artifacts/container/cpu-image-filesystem-manifest.json
          rmdir artifacts/container/runtime
      - name: Retain build and image metadata
        env:
          BUILD_METADATA: ${{ steps.build_cpu.outputs.metadata }}
          BUILD_DIGEST: ${{ steps.build_cpu.outputs.digest }}
        run: |
          printf '%s\n' "$BUILD_METADATA" > artifacts/container/cpu-build-metadata.json
          printf '%s\n' "$BUILD_DIGEST" > artifacts/container/cpu-build-digest.txt
          docker image inspect "$CALO_CPU_IMAGE" > artifacts/container/cpu-image-inspect.json
      - name: Generate a CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.CALO_CPU_IMAGE }}
          format: cyclonedx
          output: artifacts/container/cpu-image.cdx.json
          version: v0.70.0
      - name: Retain the complete vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.CALO_CPU_IMAGE }}
          format: json
          output: artifacts/container/cpu-vulnerabilities.json
          version: v0.70.0
      - name: Fail on fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.CALO_CPU_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          version: v0.70.0
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpu-container-evidence
          path: artifacts/container
          if-no-files-found: error
          retention-days: 30

  cuda-image:
    name: CUDA image, SBOM, and security build without device
    if: github.event_name != 'pull_request'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CALO_CUDA_IMAGE: calo-rpd-studio:ci-cuda-${{ github.sha }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build CUDA image and attestations
        id: build_cuda
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.CALO_CUDA_IMAGE }}
          build-args: |
            RUNTIME_LOCK=requirements-lock-cuda128-py311-linux.txt
            SOURCE_COMMIT=${{ github.sha }}
            SOURCE_TRACKED_CLEAN=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=calo-cuda128
          cache-to: type=gha,mode=max,scope=calo-cuda128
      - name: Retain CUDA build and image metadata
        env:
          BUILD_METADATA: ${{ steps.build_cuda.outputs.metadata }}
          BUILD_DIGEST: ${{ steps.build_cuda.outputs.digest }}
        run: |
          mkdir -p artifacts/container
          printf '%s\n' "$BUILD_METADATA" > artifacts/container/cuda-build-metadata.json
          printf '%s\n' "$BUILD_DIGEST" > artifacts/container/cuda-build-digest.txt
          docker image inspect "$CALO_CUDA_IMAGE" > artifacts/container/cuda-image-inspect.json
      - name: Generate CUDA CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.CALO_CUDA_IMAGE }}
          format: cyclonedx
          output: artifacts/container/cuda-image.cdx.json
          version: v0.70.0
      - name: Retain the complete CUDA vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.CALO_CUDA_IMAGE }}
          format: json
          output: artifacts/container/cuda-vulnerabilities.json
          version: v0.70.0
      - name: Fail on fixable CUDA high or critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.CALO_CUDA_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          version: v0.70.0
      - name: Upload CUDA image evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cuda-container-evidence
          path: artifacts/container
          if-no-files-found: error
          retention-days: 30

  physical-cuda:
    name: Physical CUDA qualification
    if: github.event_name == 'workflow_dispatch' && inputs.run_physical_cuda
    needs: [source, cuda-image]
    runs-on: [self-hosted, linux, x64, calo-cuda]
    timeout-minutes: 180
    env:
      CALO_CUDA_IMAGE: calo-rpd-studio:physical-cuda-${{ github.sha }}
      CALO_SOURCE_COMMIT: ${{ github.sha }}
      CALO_SOURCE_TRACKED_CLEAN: "true"
      CALO_RUNTIME_VOLUME: calo-rpd-physical-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_PROJECT_NAME: calo-rpd-physical-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify host and container GPU visibility
        run: |
          mkdir -p artifacts/physical-cuda
          nvidia-smi --query-gpu=name,uuid,memory.total,driver_version --format=csv | tee artifacts/physical-cuda/nvidia-smi.csv
          docker version > artifacts/physical-cuda/docker-version.txt
          docker compose version > artifacts/physical-cuda/compose-version.txt
          docker buildx version > artifacts/physical-cuda/buildx-version.txt
          docker compose --profile cuda build cuda
          docker image inspect "$CALO_CUDA_IMAGE" > artifacts/physical-cuda/cuda-image-inspect.json
          docker compose --profile cuda run --rm --no-deps --entrypoint python cuda -m calo_rpd_studio.scripts.container_smoke --require-durable-source | tee artifacts/physical-cuda/container-smoke.json
      - name: Prepare writable retained evidence directory
        run: sudo chown -R 10001:10001 artifacts/physical-cuda
      - name: Run durable FP64 CPU-to-CUDA parity
        run: |
          docker compose --profile cuda run --rm --no-deps --volume "$PWD/artifacts/physical-cuda:/evidence" --entrypoint python cuda -m calo_rpd_studio.scripts.validate_accelerator --device cuda --case case30 --candidates 12 --batch-size 32 --seed 20260804 --run-id "ci-${GITHUB_RUN_ID}-case30" --output /evidence/case30-parity.json --require-physical-cuda
          docker compose --profile cuda run --rm --no-deps --volume "$PWD/artifacts/physical-cuda:/evidence" --entrypoint python cuda -m calo_rpd_studio.scripts.validate_accelerator --device cuda --case case57 --candidates 12 --batch-size 32 --seed 20260804 --run-id "ci-${GITHUB_RUN_ID}-case57" --output /evidence/case57-parity.json --require-physical-cuda
      - name: Qualify CUDA-resident numerical-time share
        run: |
          docker compose --profile cuda run --rm --no-deps --volume "$PWD/artifacts/physical-cuda:/evidence" --entrypoint python cuda -m calo_rpd_studio.scripts.validate_cuda_hot_path --case case30 --batch-size 100 --batches 10 --warmup-batches 2 --seed 20260804 --run-id "ci-${GITHUB_RUN_ID}-case30-hot-path" --output /evidence/case30-hot-path.json
          docker compose --profile cuda run --rm --no-deps --volume "$PWD/artifacts/physical-cuda:/evidence" --entrypoint python cuda -m calo_rpd_studio.scripts.validate_cuda_hot_path --case case57 --batch-size 100 --batches 10 --warmup-batches 2 --seed 20260804 --run-id "ci-${GITHUB_RUN_ID}-case57-hot-path" --output /evidence/case57-hot-path.json
          docker compose --profile cuda run --rm --no-deps --volume "$PWD/artifacts/physical-cuda:/evidence" --entrypoint python cuda -m calo_rpd_studio.scripts.validate_cuda_policy_hot_path --case case30 --updates 3 --warmup-updates 1 --seed 20260804 --run-id "ci-${GITHUB_RUN_ID}-case30-policy-hot-path" --output /evidence/case30-policy-hot-path.json
          docker compose --profile cuda run --rm --no-deps --volume "$PWD/artifacts/physical-cuda:/evidence" --entrypoint python cuda -m calo_rpd_studio.scripts.validate_cuda_policy_hot_path --case case57 --updates 3 --warmup-updates 1 --seed 20260804 --run-id "ci-${GITHUB_RUN_ID}-case57-policy-hot-path" --output /evidence/case57-policy-hot-path.json
      - name: Run durable bounded resource recovery
        run: docker compose --profile cuda run --rm --no-deps --volume "$PWD/artifacts/physical-cuda:/evidence" --entrypoint python cuda -m calo_rpd_studio.scripts.validate_resource_recovery --device cuda:0 --case case30 --candidates 8 --batch-size 8 --seed 20260804 --run-id "ci-${GITHUB_RUN_ID}-resource" --output /evidence/resource-recovery.json --require-physical-cuda
      - name: Run one-hour protected physical CUDA soak
        run: docker compose --profile cuda run --rm --no-deps --volume "$PWD/artifacts/physical-cuda:/evidence" --entrypoint python cuda -m calo_rpd_studio.scripts.validate_hardware_soak --backend cuda --duration-seconds 3600 --minimum-physical-qualification-seconds 3600 --output-dir /evidence/soak --run-id "ci-${GITHUB_RUN_ID}-soak" --require-physical-cuda
      - name: Verify graceful container cancellation
        run: |
          docker compose --profile cuda up --detach cuda
          sleep 15
          docker compose --profile cuda stop --timeout 20 cuda
          test -z "$(docker compose --profile cuda ps --status running --quiet cuda)"
      - name: Clean up qualification containers
        if: always()
        run: docker compose --profile cuda down --volumes --remove-orphans
      - name: Upload physical CUDA evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: physical-cuda-evidence
          path: artifacts/physical-cuda
          if-no-files-found: error
          retention-days: 30
